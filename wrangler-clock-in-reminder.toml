name = "dh-portal-clock-in-reminder"
main = "functions/cron/daily-clock-in-reminder.js"
compatibility_date = "2026-07-29"

[triggers]
# Runs daily at 8:00 AM UTC (9:00 AM BST / 8:00 AM GMT)
crons = ["0 8 * * *"]

# Environment variables (set in Cloudflare dashboard)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# FCM_SERVER_KEY

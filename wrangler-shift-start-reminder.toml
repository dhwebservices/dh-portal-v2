name = "dh-portal-shift-start-reminder"
main = "functions/cron/shift-start-reminder.js"
compatibility_date = "2026-07-29"

[triggers]
# Every 5 minutes. WINDOW_MINUTES in the worker must match this cadence, or
# shifts can fall between two ticks and never be reminded.
crons = ["*/5 * * * *"]

# Secrets/vars to set with `wrangler secret put --config wrangler-shift-start-reminder.toml`:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   APNS_KEY_ID
#   APNS_TEAM_ID
#   APNS_AUTH_KEY
#   APNS_BUNDLE_ID
#   APNS_ENVIRONMENT           - "production" for TestFlight/App Store builds
#   CRON_TEST_SECRET           - optional; enables the manual ?secret= trigger
#
# Optional var:
#   SHIFT_REMINDER_LEAD_MINUTES - minutes before shift start (default 10)

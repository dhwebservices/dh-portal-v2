<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DH Portal</title>
    <link rel="icon" href="/dh-logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Prevent flash of unstyled content */
      html { background: #ffffff; }
      [data-theme="dark"] { background: #000000; }
    </style>
    <script>
      // Stale-deploy recovery: if the main module fails to load (old cached
      // HTML pointing at deleted chunks), force one revalidated reload.
      window.addEventListener('error', function (e) {
        var t = e.target
        if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1) {
          try {
            if (!sessionStorage.getItem('portal-boot-retry')) {
              sessionStorage.setItem('portal-boot-retry', '1')
              location.reload()
              return
            }
          } catch (err) {}
        }
      }, true)
      window.addEventListener('load', function () {
        try {
          if (document.getElementById('root') && document.getElementById('root').childNodes.length > 0) {
            sessionStorage.removeItem('portal-boot-retry')
          }
        } catch (err) {}
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html><head><meta charset="UTF-8"><title>Phone frame</title>
<style>body{margin:0;background:#888;display:flex;gap:16px;padding:12px}iframe{zoom:var(--z,1);width:390px;height:844px;border:0;border-radius:24px;background:#fff}</style></head>
<body><script>
const p = new URLSearchParams(location.search); document.body.style.setProperty("--z", p.get("z") || 1)
for (const s of (p.get('screens') || 'home').split(',')) {
  const f = document.createElement('iframe'); f.src = '/mobile-preview.html?screen=' + s + (p.get('mock') ? '&mock=1' : ''); document.body.appendChild(f)
}
</script></body></html>
